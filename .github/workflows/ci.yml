name: ci
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install ruff pyyaml web3 eth-account python-dotenv
      - name: Lint (ruff)
        run: ruff check . || true
      - name: Syntax check
        run: python -m py_compile swap.py wallet_manager.py check_balances.py
